<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#00f2fe" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="podBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2235" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#151724" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0b0d14" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fb8500" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="goldPin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="50%" stop-color="#ffe6a7"/>
      <stop offset="100%" stop-color="#d4a373"/>
    </linearGradient>
    <linearGradient id="acrylicGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#00f2fe" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a27"/>
      <stop offset="50%" stop-color="#10121a"/>
      <stop offset="100%" stop-color="#08090e"/>
    </linearGradient>
    <filter id="neonPodGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Glow & Pedestal -->
  <rect width="500" height="500" fill="#090a0f"/>
  <circle cx="250" cy="270" r="200" fill="url(#bgGlow)"/>
  <ellipse cx="250" cy="410" rx="180" ry="24" fill="#00f2fe" opacity="0.15" filter="url(#neonPodGlow)"/>
  <ellipse cx="250" cy="410" rx="150" ry="16" fill="#050608"/>

  <!-- Packaging Box in background -->
  <g transform="translate(60, 110)">
    <path d="M 30,30 L 190,0 L 250,50 L 90,80 Z" fill="#252a3d"/>
    <path d="M 30,30 L 90,80 L 90,260 L 30,210 Z" fill="url(#boxGrad)"/>
    <path d="M 90,80 L 250,50 L 250,230 L 90,260 Z" fill="#12141f" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.4"/>
    <!-- Box Details -->
    <text x="140" y="110" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#00f2fe" letter-spacing="2">AURA PODS</text>
    <text x="140" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#8e9bb0">3-PACK MESH 0.6Ω</text>
    <rect x="138" y="145" width="70" height="18" rx="4" fill="#9d4edd" opacity="0.3"/>
    <text x="144" y="157" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#c77dff">ANTI-LEAK PRO</text>
    <line x1="100" y1="185" x2="240" y2="160" stroke="#00f2fe" stroke-opacity="0.3" stroke-dasharray="3,3"/>
  </g>

  <!-- Foreground Pod 1 (Main Hero Pod Cartridge) -->
  <g transform="translate(190, 120)">
    <!-- Cartridge Acrylic Body -->
    <path d="M 35,40 C 35,20 85,20 85,40 L 95,85 L 105,95 L 105,240 C 105,248 100,252 90,252 L 30,252 C 20,252 15,248 15,240 L 15,95 L 25,85 Z" fill="url(#podBodyGrad)" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.5"/>
    <!-- Liquid Chamber (Golden E-Liquid visible) -->
    <path d="M 22,110 L 98,110 L 98,220 C 98,224 94,228 88,228 L 32,228 C 26,228 22,224 22,220 Z" fill="url(#liquidGrad)"/>
    <!-- Liquid Surface Meniscus & Bubble -->
    <ellipse cx="60" cy="110" rx="38" ry="6" fill="#ffe6a7" opacity="0.8"/>
    <circle cx="45" cy="150" r="5" fill="#ffffff" opacity="0.4"/>
    <circle cx="75" cy="180" r="3.5" fill="#ffffff" opacity="0.3"/>
    
    <!-- Central Mesh Coil Chimney -->
    <rect x="50" y="80" width="20" height="150" fill="#2d3245" rx="3" stroke="#ffd166" stroke-width="0.8" stroke-opacity="0.5"/>
    <rect x="54" y="125" width="12" height="35" rx="2" fill="#000000" opacity="0.6"/>
    <line x1="56" y1="132" x2="64" y2="132" stroke="#ffd166" stroke-width="1"/>
    <line x1="56" y1="142" x2="64" y2="142" stroke="#ffd166" stroke-width="1"/>
    <line x1="56" y1="152" x2="64" y2="152" stroke="#ffd166" stroke-width="1"/>

    <!-- Ergonomic Mouthpiece / Duckbill tip -->
    <path d="M 38,40 C 38,25 45,15 60,15 C 75,15 82,25 82,40 Z" fill="#0f1118" stroke="#3a405a" stroke-width="1"/>
    <ellipse cx="60" cy="18" rx="14" ry="4" fill="#050608"/>
    
    <!-- Glass Highlights & Reflections -->
    <path d="M 22,95 L 35,95 L 35,230 L 22,230 Z" fill="url(#acrylicGlass)"/>
    <line x1="90" y1="95" x2="90" y2="230" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Magnetic Gold Contacts & Airflow base -->
    <rect x="25" y="248" width="15" height="5" rx="2" fill="url(#goldPin)"/>
    <rect x="80" y="248" width="15" height="5" rx="2" fill="url(#goldPin)"/>
    <circle cx="60" cy="250" r="3" fill="#000000"/>
    
    <!-- Fill Mark Indicator -->
    <text x="32" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#ffffff" opacity="0.6">- MIN -</text>
  </g>

  <!-- Secondary Angled Pod 2 (Right) -->
  <g transform="translate(305, 180) rotate(18)">
    <path d="M 30,35 C 30,20 70,20 70,35 L 78,75 L 85,85 L 85,210 C 85,216 80,220 72,220 L 28,220 C 20,220 15,216 15,210 L 15,85 L 22,75 Z" fill="url(#podBodyGrad)" stroke="#9d4edd" stroke-width="1" stroke-opacity="0.4"/>
    <path d="M 20,100 L 80,100 L 80,195 C 80,200 76,204 70,204 L 30,204 C 24,204 20,200 20,195 Z" fill="#9d4edd" opacity="0.55"/>
    <ellipse cx="50" cy="100" rx="30" ry="5" fill="#e0aaff" opacity="0.6"/>
    <rect x="42" y="70" width="16" height="130" fill="#202230" rx="2"/>
    <!-- Gold pins -->
    <rect x="25" y="217" width="12" height="4" rx="2" fill="url(#goldPin)"/>
    <rect x="63" y="217" width="12" height="4" rx="2" fill="url(#goldPin)"/>
  </g>
</svg>
