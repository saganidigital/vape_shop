<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="lycheeBgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff70a6" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#70d6ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lycheeLiquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff70a6"/>
      <stop offset="50%" stop-color="#ff9770"/>
      <stop offset="100%" stop-color="#ffd670"/>
    </linearGradient>
    <linearGradient id="glassReflection4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="70%" stop-color="#70d6ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="capGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30232b"/>
      <stop offset="35%" stop-color="#543d4c"/>
      <stop offset="70%" stop-color="#231920"/>
      <stop offset="100%" stop-color="#120c10"/>
    </linearGradient>
    <linearGradient id="labelGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171115"/>
      <stop offset="50%" stop-color="#0d080c"/>
      <stop offset="100%" stop-color="#1e141c"/>
    </linearGradient>
    <filter id="liquidGlow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="#090a0f"/>
  <circle cx="250" cy="270" r="190" fill="url(#lycheeBgGlow)"/>
  <ellipse cx="250" cy="435" rx="130" ry="20" fill="#ff70a6" opacity="0.25" filter="url(#liquidGlow4)"/>
  <ellipse cx="250" cy="435" rx="100" ry="12" fill="#050608"/>

  <g transform="translate(145, 45)">
    <!-- Dropper Tip -->
    <path d="M 98,15 L 112,15 L 115,48 L 95,48 Z" fill="#120c10"/>
    <ellipse cx="105" cy="15" rx="7" ry="2.5" fill="#543d4c"/>

    <!-- Ribbed Cap -->
    <rect x="75" y="48" width="60" height="65" rx="6" fill="url(#capGrad4)" stroke="#523949" stroke-width="1"/>
    <line x1="83" y1="52" x2="83" y2="108" stroke="#0f070e" stroke-width="2"/>
    <line x1="91" y1="52" x2="91" y2="108" stroke="#0f070e" stroke-width="2"/>
    <line x1="99" y1="52" x2="99" y2="108" stroke="#0f070e" stroke-width="2"/>
    <line x1="107" y1="52" x2="107" y2="108" stroke="#0f070e" stroke-width="2"/>
    <line x1="115" y1="52" x2="115" y2="108" stroke="#0f070e" stroke-width="2"/>
    <line x1="123" y1="52" x2="123" y2="108" stroke="#0f070e" stroke-width="2"/>
    <rect x="72" y="105" width="66" height="12" rx="3" fill="#231920" stroke="#ff70a6" stroke-width="0.6" stroke-opacity="0.5"/>

    <rect x="80" y="117" width="50" height="16" fill="#1f131a" opacity="0.9"/>

    <!-- Body -->
    <path d="M 40,150 C 40,130 75,128 80,128 L 130,128 C 135,128 170,130 170,150 L 170,360 C 170,378 150,385 105,385 C 60,385 40,378 40,360 Z" fill="#120c10" stroke="#ff70a6" stroke-width="1.2" stroke-opacity="0.5"/>

    <!-- E-Liquid -->
    <path d="M 42,165 C 42,150 75,145 80,145 L 130,145 C 135,145 168,150 168,165 L 168,358 C 168,374 150,382 105,382 C 60,382 42,374 42,358 Z" fill="url(#lycheeLiquid)"/>
    <ellipse cx="105" cy="165" rx="63" ry="9" fill="#ffe5ec" opacity="0.8"/>

    <!-- Bubbles -->
    <circle cx="65" cy="230" r="4" fill="#ffffff" opacity="0.4"/>
    <circle cx="140" cy="275" r="5" fill="#ffffff" opacity="0.35"/>
    <circle cx="90" cy="335" r="3.5" fill="#ffffff" opacity="0.3"/>

    <!-- Label -->
    <rect x="42" y="195" width="126" height="150" fill="url(#labelGrad4)" stroke="#ff70a6" stroke-width="0.8"/>
    <line x1="42" y1="195" x2="168" y2="195" stroke="#70d6ff" stroke-width="2"/>
    <line x1="42" y1="345" x2="168" y2="345" stroke="#ff70a6" stroke-width="2"/>
    
    <text x="105" y="222" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#70d6ff" text-anchor="middle" letter-spacing="2">AURA NIC-SALT</text>
    <text x="105" y="244" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">TOKYO LYCHEE</text>
    <text x="105" y="262" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" fill="#ff70a6" text-anchor="middle" letter-spacing="1">GUAVA MIST</text>
    
    <rect x="58" y="278" width="94" height="18" rx="9" fill="#300d23" stroke="#ff70a6" stroke-width="0.8"/>
    <text x="105" y="290" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#ffb3c6" text-anchor="middle">SUB-ZERO CHILL</text>

    <text x="105" y="318" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#8e9bb0" text-anchor="middle">30ML · 50VG / 50PG · 25MG</text>
    <text x="105" y="333" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="600" fill="#5c4d57" text-anchor="middle">SALT NICOTINE FORMULA</text>

    <!-- Reflections -->
    <path d="M 44,145 L 62,145 L 62,370 L 44,360 Z" fill="url(#glassReflection4)"/>
    <line x1="162" y1="145" x2="162" y2="370" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.35"/>
    <ellipse cx="105" cy="382" rx="60" ry="4" fill="#ff70a6" opacity="0.4"/>
  </g>
</svg>
